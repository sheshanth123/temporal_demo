[project]
name = "ebay"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "sheshmltv", email = "sheshanth@techvariable.com" }
]
requires-python = ">=3.11"
dependencies = [
    "python-dotenv>=1.2.3",
    "httpx>=0.27.0",
    "temporalio>=1.18.0",
]

[project.scripts]
ebay-worker = "ebay.worker:run_worker"
